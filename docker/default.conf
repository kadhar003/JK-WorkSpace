upstream app {
    server app:9000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to specific files
    location ~ /\.(env|env.example|log|htaccess|gitignore|gitattributes)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to vendor, node_modules, etc
    location ~ ^/(vendor|node_modules|storage/framework|bootstrap/cache)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static files (images, css, js)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Frontend built assets
    location ^~ /build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # All requests go through index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param LARAVEL_TINKER_WRITE_HISTORY false;
        
        include fastcgi_params;
    }
}
